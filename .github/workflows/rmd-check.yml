name: rmd-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Install knitr
        run: Rscript -e 'install.packages("knitr", repos = "https://cloud.r-project.org")'
      - name: Extract R code from every .Rmd and check it parses
        run: |
          Rscript -e '
            files <- list.files(pattern = "\\.Rmd$")
            for (f in files) {
              out <- knitr::purl(f, output = tempfile(fileext = ".R"), quiet = TRUE)
              invisible(parse(out))
              cat("ok", f, "\n")
            }
            cat(length(files), "R Markdown files parsed\n")'
